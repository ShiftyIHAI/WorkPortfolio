<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URate — Rate Your Games</title>
  <meta name="description" content="URate — The community-powered video game rating site. Rate games out of 10, read reviews, and upvote the best takes.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav id="main-nav"></nav>

  <main>
    <section class="hero" id="hero"></section>

    <div class="container">
      <section class="section" id="top-rated">
        <div class="section-header">
          <h2 class="section-title">All Games</h2>
          <button class="section-action" id="open-add-game-2">+ Add Game</button>
        </div>
        <div class="games-grid" id="games-grid"></div>
      </section>
    </div>
  </main>

  <footer>
    <div class="container">
      <div class="footer-inner">
        <div class="footer-logo">
          <svg width="20" height="26" viewBox="0 0 36 46" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="6" y="21" width="24" height="22" rx="5" fill="rgba(255,255,255,0.25)"/>
            <path d="M6 32 Q6 21 11 21 H25 Q30 21 30 32" fill="rgba(255,255,255,0.25)"/>
            <rect x="10" y="11" width="16" height="12" rx="3" fill="rgba(255,255,255,0.25)"/>
            <rect x="8" y="5" width="20" height="8" rx="4" fill="rgba(255,255,255,0.25)"/>
            <circle cx="13" cy="9" r="2" fill="#111" opacity="0.5"/>
            <circle cx="18" cy="9" r="2" fill="#111" opacity="0.5"/>
            <circle cx="23" cy="9" r="2" fill="#111" opacity="0.5"/>
          </svg>
          <span class="footer-logo-text">URate</span>
        </div>
        <span>Community-powered game ratings &mdash; urate (NaCl) your games.</span>
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
